<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11182f">
<title>Sem conexão • EchoNet</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:#f5f6ff;background:radial-gradient(circle at 50% 8%,#282a69 0,transparent 42%),linear-gradient(160deg,#0f1834,#100d29 80%)}
main{max-width:440px;text-align:center;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.13);padding:36px 28px;border-radius:28px;box-shadow:0 22px 90px #0004}img{width:96px;height:96px;border-radius:24px}h1{margin:22px 0 8px;font-size:clamp(24px,6vw,32px)}p{color:#c5c7dd;line-height:1.6;margin:0 0 24px}button{color:white;background:linear-gradient(115deg,#5954e8,#9b42de);border:0;border-radius:14px;padding:14px 24px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 10px 24px #4e2ccb55}button:focus-visible{outline:3px solid #6fe9ff;outline-offset:4px}
</style>
</head>
<body>
<main>
<img src="/img/pwa/icon-192.png" alt="Ícone do EchoNet">
<h1>Você está sem conexão</h1>
<p>O EchoNet precisa de internet para carregar seu feed e suas mensagens. Assim que a conexão voltar, você pode continuar de onde parou.</p>
<button type="button" onclick="location.reload()">Tentar novamente</button>
</main>
</body>
</html>
